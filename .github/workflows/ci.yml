name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy veile_bot

      - name: Test
        run: pytest

      # 秘密情報がコミットされていないことの最低限の歯止め。
      - name: Guard against committed credentials
        run: |
          if git ls-files | grep -E '(^|/)info\.json$|\.env$'; then
            echo "::error::認証情報らしきファイルが追跡されています"
            exit 1
          fi
