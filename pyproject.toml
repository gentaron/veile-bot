[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veile-bot"
version = "2.0.0"
description = "AI ツール / リポジトリ / モデルの日次ダイジェストを LINE に配信するボット"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "gentaron" }]
keywords = ["line-bot", "digest", "github-trending", "huggingface", "claude"]

# ランタイムは標準ライブラリのみ。LLM 要約を使う場合のみ extras を入れる。
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.69"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
veile-bot = "veile_bot.cli:main"

[project.urls]
Homepage = "https://github.com/gentaron/veile-bot"

[tool.setuptools.packages.find]
include = ["veile_bot*"]

[tool.setuptools.package-data]
veile_bot = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE", "S"]
# RUF001-003: 日本語コメント/文字列の全角括弧は意図的なもの。
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# assert はテストの本体。S105/S106 はダミートークン文字列。
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
